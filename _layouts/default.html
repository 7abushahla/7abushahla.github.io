<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="light">
<head>
  {% include head.html %}
</head>
<body>
  {% include nav.html %}

  <main id="main">
    {{ content }}
  </main>

  {% include footer.html %}

  <script>
    (function () {
      var root = document.documentElement;

      // Theme toggle — persists, and the icon reflects current state.
      var icon = document.querySelector('[data-theme-icon]');
      function paintIcon() {
        if (icon) icon.textContent = root.getAttribute('data-theme') === 'dark' ? '☀' : '☾';
      }
      paintIcon();
      var tt = document.querySelector('.theme-toggle');
      if (tt) tt.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        paintIcon();
      });

      // Mobile nav disclosure.
      var toggle = document.querySelector('.nav-toggle');
      var nav = document.getElementById('sitenav');
      if (toggle && nav) toggle.addEventListener('click', function () {
        var open = toggle.getAttribute('aria-expanded') === 'true';
        toggle.setAttribute('aria-expanded', String(!open));
        nav.classList.toggle('is-open', !open);
      });
    })();
  </script>
</body>
</html>
