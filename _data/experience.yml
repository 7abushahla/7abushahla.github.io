# Experience, grouped into tracks. Newest first within each track.
#
# Per entry:
#   org       required. Organization name.
#   unit      optional. Center / lab / department within the org.
#   client    optional. Shown as "› Client" — for agency-style engagements.
#   role      required. Your title.
#   from / to required. Display strings. Leave `to` as "present" for ongoing.
#   active    optional. true renders the teal ACTIVE marker.
#   advisors  optional. Free text.
#   location  optional.
#   logo      optional. Path to an image, e.g. /images/logos/aus.svg
#   monogram  fallback shown when no logo file exists yet.
#   body      optional. One short paragraph.

- track: Industry, Research & Development
