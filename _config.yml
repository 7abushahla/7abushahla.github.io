# ─────────────────────────────────────────────────────────────
# Site
# ─────────────────────────────────────────────────────────────
name: Hamza Ahmed Abushahla
short_name: Hamza Abushahla
tagline: Researcher & Embedded ML Engineer
description: >-
  Quantization, compression, and hardware-aware optimization for deep learning
  that has to run under hard latency, memory, and power budgets — on
  microcontrollers, embedded platforms, and drones.
url: "https://7abushahla.github.io"
avatar: /images/profile_image_compressed.jpg
lang: en

# ─────────────────────────────────────────────────────────────
# Build
# ─────────────────────────────────────────────────────────────
permalink: /:title/

collections:
  publications:
    output: false

defaults:
  - scope:
      path: ""
      type: publications
    values:
      status: project

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

sass:
  style: :compressed

plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - command.txt
  - todo.txt
  - _make_favicon.sh
  - _make_thumbnails.sh
  - Profile.pdf
  - H_Abushahla_Master_CV-2.pdf
  - vendor
