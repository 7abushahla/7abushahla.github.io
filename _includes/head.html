<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} — {{ site.short_name }}{% else %}{{ site.short_name }}{% endif %}</title>

<meta name="author" content="{{ site.name }}">
<meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
<link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

<meta property="og:type" content="website">
<meta property="og:title" content="{% if page.title and page.url != '/' %}{{ page.title }} — {{ site.short_name }}{% else %}{{ site.short_name }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ site.avatar | absolute_url }}">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">

<script>
  // Set theme before first paint so there is no flash.
  (function () {
    try {
      var s = localStorage.getItem('theme');
      var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', s || (d ? 'dark' : 'light'));
    } catch (e) {}
  })();
</script>

<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-E00L9PT3V9');
</script>
